# CI pipeline for brightbuy-backend — specs/global/12_DEVOPS_CICD.md §2.1.
#
# Stage order matters: cheap/fast checks (format, vet) run before slow ones (integration tests,
# image build), so a trivial mistake fails in seconds, not minutes.
name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt (fails if anything is unformatted)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt'd:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit tests
        run: go test ./... -short -v

      # Integration tests need a real MySQL 8, but NOT as a GitHub Actions `services:` container —
      # internal/catalog/mysql's *_test.go (build tag `integration`) uses testcontainers-go to start
      # and tear down its own disposable MySQL container per test run, applying the real
      # db/migrations/*.up.sql via the golang-migrate library first (specs/global/12_DEVOPS_CICD.md
      # §2.1 step 5). ubuntu-latest runners have Docker available to every step already, which is
      # all testcontainers-go needs — no `services:` block, no DB_DSN, no manual health check.
      - name: Integration tests
        run: go test ./... -tags=integration -v

      - name: Build (compile check)
        run: go build ./...

  build-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t brightbuy-backend:${{ github.sha }} .
      # Pushing to a registry (GHCR) is added once a registry/hosting target is chosen
      # (TBD-7, specs/global/10_BA_AUDIT_OPEN_QUESTIONS.md).
