# CI pipeline for brightbuy-backend — specs/global/12_DEVOPS_CICD.md §2.1.
#
# Stage order matters: cheap/fast checks (format, vet) run before slow ones (integration tests,
# image build), so a trivial mistake fails in seconds, not minutes.
name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt (fails if anything is unformatted)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt'd:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Built from source with the SAME Go toolchain as the project (go-version-file above), not the
      # action's pre-built release binary: that binary reads Go's compiled package data through an older
      # library and fails on a newer Go with "export data version N is greater than maximum supported
      # version M". Compiling it here keeps the linter and the compiler in step by construction.
      # -tags=integration also lints the integration test files, which a plain run skips.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          staticcheck -tags=integration ./...

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit tests
        run: go test ./... -short -v

      # Integration tests need a real MySQL 8, but NOT as a GitHub Actions `services:` container —
      # internal/catalog/mysql's *_test.go (build tag `integration`) uses testcontainers-go to start
      # and tear down its own disposable MySQL container per test run, applying the real
      # db/migrations/*.up.sql via the golang-migrate library first (specs/global/12_DEVOPS_CICD.md
      # §2.1 step 5). ubuntu-latest runners have Docker available to every step already, which is
      # all testcontainers-go needs — no `services:` block, no DB_DSN, no manual health check.
      - name: Integration tests
        run: go test ./... -tags=integration -v

      - name: Build (compile check)
        run: go build ./...

  # Continuous delivery, step 1: every green push to main produces a runnable image in GitHub's
  # container registry (ghcr.io), tagged with the commit and `latest`. Any host that runs containers
  # (Render, Fly.io, Railway, a VM) can pull it; see docs/DEPLOYMENT.md. Pull requests only BUILD the
  # image (proving the Dockerfile works) and never push. GITHUB_TOKEN is enough: no extra secret.
  build-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase, and a GitHub username may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/brightbuy-backend" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push, on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
